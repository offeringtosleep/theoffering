<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Sleep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');

    :root {
      /* ⚙️ Modifiez ici le code PIN (4 chiffres) */
      --pin-code: "2007";
    }

    /* --- LOGO OVERLAY --- */
    #logo-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 2.5s ease 2s forwards;
    }

    #logo-overlay img {
      width: 150px;
      height: auto;
      opacity: 0;
      animation: fadeInLogo 2s ease forwards;
      filter: drop-shadow(0 0 15px #cfaaff);
    }

    @keyframes fadeInLogo {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    /* --- BASE STYLE --- */
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'UnifrakturCook', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      overflow: hidden; /* bloqué tant que le PIN n'est pas validé */
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 8rem;
      text-align: center;
      text-shadow: 0 0 10px #5e5e5e;
      color: #cfaaff;
    }

    h2 {
      font-size: 1.6rem;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 0 10px #5e5e5e;
      color: #8b0000;
    }

    h2 a {
      display: inline-block;
      font-size: 1.6rem;
      color: #ff0000 !important;
      text-shadow: 0 0 5px #ff0000;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    h2 a:visited { color: #ff0000 !important; }
    h2 a:hover { color: #ff3333 !important; text-shadow: 0 0 8px #ff0000; }
    h2 a:active { color: #ff6666 !important; }

    .pdf-container {
      width: 100%;
      max-width: 1020px;
      height: 85vh;
      overflow-y: scroll;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(207, 170, 255, 0.3);
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .mobile-link {
      display: none;
      max-width: 600px;
      padding: 1rem;
      text-align: center;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(207, 170, 255, 0.1);
    }
    .mobile-link p { margin: 0.5rem 0; }

    @media (max-width: 768px) {
      .pdf-container { display: none; }
      .mobile-link { display: block; }
    }

      /* --- PIN OVERLAY --- */
    #pin-overlay {
      position: fixed;
      inset: 0;
      display: none; /* affiché après l'anim du logo */
      align-items: center;
      justify-content: center;
      background: rgba(13, 13, 13, 0.95); /* plus opaque */
      backdrop-filter: blur(8px); /* flou plus marqué */
      z-index: 9998;
    }


    .pin-card {
      width: min(92vw, 600px);
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(207, 170, 255, 0.2);
      padding: 1.5rem;
      text-align: center;
    }

    .pin-title {
      color: #cfaaff;
      font-size: 1.8rem;
      margin: 0 0 0.75rem;
      text-shadow: 0 0 8px rgba(207,170,255,0.35);
    }

    .pin-sub {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #c8c8c8;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }

    .pin-inputs {
      display: flex;              /* flex au lieu de grid */
      justify-content: center;    /* centre horizontalement */
      align-items: center;        /* centre verticalement */
      gap: 0.75rem;               /* espace régulier entre cases */
      margin: 1rem 0 0.75rem;
    }

    .pin-input {
      width: 50px;                 /* largeur réduite */
      height: 50px;                /* hauteur réduite */
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      background: #0f0f0f;
      border: 1px solid #2d2d2d;
      color: #eaeaea;
      border-radius: 12px;
    }

    .pin-input:focus {
      box-shadow: 0 0 0 3px rgba(207, 170, 255, 0.25);
      border-color: #70539d;
    }

    .pin-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover { box-shadow: 0 0 0 3px rgba(207,170,255,0.18); }
    .btn:active { transform: translateY(1px); }

    .btn-primary { background: #2b1e3f; border-color: #4e3a75; }
    .btn-primary:hover { background: #35264e; }

    .pin-error {
      height: 1.25rem;
      margin-top: 0.25rem;
      color: #ff7777;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 0.9rem;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-8px); }
      40%, 60% { transform: translateX(8px); }
    }

    .shake { animation: shake 0.4s ease both; }
  </style>
</head>
<body>
  <!-- Logo overlay -->
  <div id="logo-overlay">
    <img src="./library/logo-sleep.png" alt="Sleep Token Logo" />
  </div>

  <!-- PIN overlay -->
  <div id="pin-overlay" aria-modal="true" role="dialog">
    <div class="pin-card" id="pin-card">
      <div class="pin-title">Only the Chosen One Can Access</div>
      <div class="pin-sub">Enter the Key</div>

      <form id="pin-form" autocomplete="off">
        <div class="pin-inputs" id="pin-inputs">
          <input class="pin-input" inputmode="numeric" pattern="\d*" maxlength="1" aria-label="Chiffre 1" />

          <input class="pin-input" inputmode="numeric" pattern="\d*" maxlength="1" aria-label="Chiffre 2" />
          <input class="pin-input" inputmode="numeric" pattern="\d*" maxlength="1" aria-label="Chiffre 3" />
          <input class="pin-input" inputmode="numeric" pattern="\d*" maxlength="1" aria-label="Chiffre 4" />
        </div>
        <div class="pin-actions">
          <button type="button" class="btn" id="pin-clear">Effacer</button>
          <button type="submit" class="btn btn-primary">Valider</button>
        </div>
        <div class="pin-error" id="pin-error" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- Titre -->
  <h1>ᛑ The Offering ᛛ</h1>

  <!-- Version Desktop : PDF intégré -->
  <div class="pdf-container">
    <iframe src="./library/The Offering.pdf#toolbar=0&scrollbar=0" type="application/pdf"></iframe>
  </div>

  <!-- Version Mobile -->
  <div class="mobile-link">
    <p>What Might Be Good For Your Heart</p>
    <p>Might Not Be Good For My Head</p>
    <br />
    <h2><a href="./library/The Offering.pdf" target="_blank" rel="noopener">Open The Offering</a></h2>
  </div>

  <script>
    // ⚠️ Ceci est un simple garde côté client. Pour une vraie protection,
    // utilisez une vérification côté serveur (sessions, JWT, etc.).

    const PIN_LENGTH = 4;
    const CORRECT_PIN = getComputedStyle(document.documentElement).getPropertyValue('--pin-code').replaceAll('"','').trim();

    const logoOverlay = document.getElementById('logo-overlay');
    const pinOverlay  = document.getElementById('pin-overlay');
    const pinForm     = document.getElementById('pin-form');
    const pinInputs   = Array.from(document.querySelectorAll('.pin-input'));
    const pinError    = document.getElementById('pin-error');
    const pinCard     = document.getElementById('pin-card');
    const pinClearBtn = document.getElementById('pin-clear');

    function showPin() {
      pinOverlay.style.display = 'flex';
      pinInputs[0].focus();
    }

    function hidePin() {
      pinOverlay.style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    // Affiche le PIN overlay quand l'animation du logo se termine
    logoOverlay.addEventListener('animationend', (e) => {
      if (e.animationName === 'fadeOut') {
        showPin();
      }
    });

    // UX: navigation auto entre les inputs
    pinInputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 1); // force chiffre unique
        if (input.value && idx < PIN_LENGTH - 1) {
          pinInputs[idx + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          pinInputs[idx - 1].focus();
        }
        if (e.key === 'ArrowLeft' && idx > 0) pinInputs[idx - 1].focus();
        if (e.key === 'ArrowRight' && idx < PIN_LENGTH - 1) pinInputs[idx + 1].focus();
        if (e.key === 'Enter') pinForm.requestSubmit();
      });
    });

    pinClearBtn.addEventListener('click', clearPin);

    function clearPin() {
      pinInputs.forEach(i => i.value = '');
      pinInputs[0].focus();
      pinError.textContent = '';
    }

    function getEnteredPin() {
      return pinInputs.map(i => i.value).join('');
    }

    function denyPin() {
      pinError.textContent = 'Code incorrect. Réessayez.';
      pinCard.classList.remove('shake');
      // force reflow pour relancer l'animation
      void pinCard.offsetWidth;
      pinCard.classList.add('shake');
      clearPin();
    }

    pinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const entered = getEnteredPin();
      if (entered.length < PIN_LENGTH) {
        pinError.textContent = 'Veuillez entrer 4 chiffres.';
        return;
      }
      if (entered === CORRECT_PIN) {
        hidePin();
      } else {
        denyPin();
      }
    });

    // Fallback de sécurité minimale : si l'animation ne se déclenche pas, afficher le PIN au bout de 5s
    setTimeout(() => {
      const isLogoHidden = getComputedStyle(logoOverlay).visibility === 'hidden' || getComputedStyle(logoOverlay).opacity === '0';
      if (isLogoHidden && pinOverlay.style.display !== 'flex') {
        showPin();
      }
    }, 5000);
  </script>
</body>
</html>
